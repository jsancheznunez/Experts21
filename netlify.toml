# Netlify builds the web app in web/ with no extra settings in the Netlify UI.
# Paths below (publish, functions) are relative to the base directory.
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
  # Always build. Without this, Netlify skips builds when nothing inside web/ changed, but the app
  # also reads ../.claude, ../knowledge and ../docs at build time, so those edits must redeploy too.
  # (An exit code of 1 from the ignore command means "don't ignore: build".)
  ignore = "exit 1"

[build.environment]
  NODE_VERSION = "22"
  # Python for the build-time NLTK + spaCy analysis (web/scripts/build-nlp.sh).
  PYTHON_VERSION = "3.12"
  # Fail the deploy if the NLP analysis fails; Netlify keeps the previous deploy live.
  NLP_STRICT = "1"

[functions]
  node_bundler = "esbuild"
